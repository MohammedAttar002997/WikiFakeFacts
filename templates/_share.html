{# Share a finished quiz. Expects `share` from share_details(): {'url', 'text'}. #}
<div class="wf-card wf-card-pad share-card">
    <div class="section-label mb-2"><i class="bi bi-share-fill text-brand fs-4"></i>{{ _('Share your result') }}</div>
    <p class="small text-muted mb-3">{{ _('Anyone with the link can see your score and take the same quiz.') }}</p>
    <div class="d-flex flex-column flex-sm-row gap-2">
        <input type="text" class="form-control" id="shareUrl" value="{{ share.url }}" readonly aria-label="{{ _('Share link') }}">
        <button type="button" class="btn btn-primary flex-shrink-0" id="shareButton"
                data-share-text="{{ share.text }}" data-share-url="{{ share.url }}"
                data-copied-label="{{ _('Link copied!') }}">
            <i class="bi bi-share me-1"></i><span>{{ _('Share') }}</span>
        </button>
    </div>
</div>
<script>
    (function () {
        const button = document.getElementById('shareButton');
        const input = document.getElementById('shareUrl');
        input.addEventListener('focus', () => input.select());
        button.addEventListener('click', async () => {
            const text = button.dataset.shareText, url = button.dataset.shareUrl;
            // Phones get the native share sheet; elsewhere copy the message and link
            if (navigator.share) {
                try { await navigator.share({ title: 'WikiFakeFact', text, url }); } catch (e) { /* cancelled */ }
                return;
            }
            try {
                await navigator.clipboard.writeText(text + ' ' + url);
                button.querySelector('span').textContent = button.dataset.copiedLabel;
            } catch (e) {
                input.focus();  // No clipboard access: leave the link selected to copy by hand
            }
        });
    })();
</script>
