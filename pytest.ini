[pytest]
testpaths = tests
addopts = -q
markers =
    slow: runs the app in a subprocess (migration tests); skip with -m "not slow"
filterwarnings =
    # The app uses datetime.utcnow() throughout; Python 3.12+ deprecates it but it still works
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
